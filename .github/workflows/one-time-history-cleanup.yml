name: '109 - MAINTENANCE | Remove obsolete test runs'
on:
  push:
    branches: [fix/purffle-footage-recovery]
    paths:
      - '.github/workflows/one-time-history-cleanup.yml'
permissions:
  actions: write
  contents: read
jobs:
  cleanup-obsolete-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Delete only obsolete test and CI history (preserve video production)
        env:
          API_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request
          token = os.environ["API_TOKEN"]
          repo = os.environ["REPO_NAME"]
          current = int(os.environ["THIS_RUN_ID"])
          api = "https://api.github.com/repos/" + repo
          base = {"Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Purffle-Test-History-Cleanup"}
          def get(path):
              req = urllib.request.Request(api + path, headers=base)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)
          # These are purely diagnostic workflows; ALL production workflow
          # results and MP4 artifacts are explicitly excluded.
          obsolete = re.compile(r"^(?:[0-9]{2,3} - TEMP(?: |\\b)|90 - INTERNAL\\b|91 - INTERNAL\\b)$")
          def is_obsolete(name):
              return (bool(re.match(r"^\\d{2,3} - TEMP \\|", name))
                  or name.startswith("90 - INTERNAL |")
                  or name.startswith("91 - INTERNAL |")
                  or name in ("Purffle regression checks",
                              "Purffle change validation",
                              "Science source regression (fast, offline)"))
          runs = []
          for page in range(1, 24):
              batch = get("/actions/runs?per_page=100&page=" + str(page)).get("workflow_runs", [])
              runs.extend(batch)
              if len(batch) < 100:
                  break
          targets = [(int(r["id"]), r.get("name","")) for r in runs
                     if int(r["id"]) != current and is_obsolete(r.get("name",""))]
          print("[CLEANUP] run_total=", len(runs),
                "obsolete_diagnostics=", len(targets),
                "protected_production=", len(runs)-len(targets)-1, flush=True)
          ok, failed = 0, []
          for number,(run_id,name) in enumerate(targets,1):
              req = urllib.request.Request(
                  api + "/actions/runs/" + str(run_id),
                  method="DELETE", headers=base)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as resp:
                          status = resp.status
                      if status == 204:
                          ok += 1
                      else:
                          failed.append((run_id, status))
                      break
                  except urllib.error.HTTPError as e:
                      if e.code == 404:  # deleted by another cleanup worker
                          ok += 1
                          break
                      if e.code in (403, 429, 500, 502, 503) and attempt < 4:
                          wait = min(75, max(3, int(e.headers.get("Retry-After", "0") or "0")))
                          time.sleep(wait if e.code in (403,429) else 2 ** attempt)
                          continue
                      failed.append((run_id, e.code))
                      break
                  except Exception as e:
                      failed.append((run_id, type(e).__name__))
                      break
              if number % 75 == 0:
                  print("[CLEANUP] deleted=", ok,
                        "attempted=", number, "failed=",len(failed),flush=True)
              time.sleep(0.23)
          print("[CLEANUP RESULT] deleted=",ok,"failed=",len(failed),flush=True)
          if failed:
              print("[CLEANUP ERROR IDS] ",failed[:30],flush=True)
              raise SystemExit(1)
          PY
