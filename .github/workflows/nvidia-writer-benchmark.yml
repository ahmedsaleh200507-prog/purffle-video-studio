name: NVIDIA free trial writer evaluation
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/nvidia-writer-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specialist-model-pilot
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PURFFLE_NVIDIA_FREE_CONFIRMED: ${{ vars.PURFFLE_NVIDIA_FREE_CONFIRMED }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PURFFLE_LOCAL_LLM: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'Pillow>=10.1,<14' 'langdetect==1.0.9' 'jsonschema>=4.20,<5' 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_nvidia_writer_benchmark.py tests/test_openrouter_writer_benchmark.py tests/test_specialist_model_pilot.py
      - run: python scripts/nvidia_writer_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvidia-internal-writer-evaluation
          path: nvidia-writer-benchmark/
          if-no-files-found: warn
          retention-days: 7
