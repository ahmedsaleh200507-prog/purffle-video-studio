name: Advanced visual tools
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/advanced_visuals.py'
      - 'scripts/action_window.py'
      - 'scripts/object_framing.py'
      - 'scripts/verified_library.py'
      - 'requirements-advanced-visuals.txt'
      - 'tests/test_advanced_visuals.py'
      - '.github/workflows/advanced-visuals.yml'
permissions:
  contents: read
concurrency:
  group: advanced-visuals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-advanced-visuals.txt 'pytest>=8,<10' requests 'Pillow>=10,<14'
      - name: Install FFmpeg and OpenCV runtime
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg libgl1 libglib2.0-0t64
      - run: python -m pytest -q tests/test_advanced_visuals.py
      - run: python -m unittest discover -s tests -p test_action_window.py
      - run: python -m unittest discover -s tests -p test_object_framing.py
      - run: python -m unittest discover -s tests -p test_verified_library.py
      - name: Real footage scene analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from video_contrast_audit import fixture
          from advanced_visuals import scene_intervals
          path=Path("audit-person.avi")
          fixture(path)
          spans=scene_intervals(path,8)
          assert spans and all(0<=a<b<=8 for a,b in spans)
          print("[REAL SCENES]",json.dumps(spans))
          PY
