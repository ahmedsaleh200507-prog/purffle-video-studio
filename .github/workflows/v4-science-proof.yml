name: '92 - TEMP | Science source recovery live proof'
on:
  push:
    branches: [fix/purffle-footage-recovery]
    paths: ['.github/workflows/v4-science-proof.yml']
permissions:
  contents: read
jobs:
  real-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVER2: ${{ secrets.COVER2 }}
      INPUT_1: 'en|Why is the sky blue?'
      PURFFLE_MEDIA_FIRST: '1'
      PURFFLE_RESUME: '0'
      PURFFLE_AUTO_720_FALLBACK: '1'
      VISUAL_SOURCES: 'pixabay,wikimedia-video,nasa-video,archive-video,freenaturestock-video'
      PURFFLE_NARRATOR_LOCK: '1'
      PURFFLE_NO_ATTRIBUTION: '1'
      RESOLUTION: '1080x1920'
      FPS: '30'
      TTS_ENGINE: piper
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-20b
      SCRIPT_REVIEW: 'off'
      SEO_KEYWORDS: 'false'
      MUSIC_VOLUME: '0'
      SOUND_EFFECTS: 'false'
      WATERMARK: none
      CAPTION_EMOJI: 'false'
      MAX_SHOT_SECONDS: '0'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Restore model cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v4-model-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'scripts/local_voice.py', 'scripts/media_validation.py') }}
      - name: Verify pinned upstream and source-search regression
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q tests/test_science_sources.py -k blue_sky
          python scripts/improve_upstream.py
      - name: Produce one real sky-blue Short
        env:
          PURFFLE_STRICT: '1'
        run: python scripts/batch.py
      - name: Save proof or failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-blue-sky-science-proof
          path: |
            finished/
            batch-results.json
            PURFFLE_DIAGNOSTICS.txt
            PURFFLE_DIAGNOSTICS.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
