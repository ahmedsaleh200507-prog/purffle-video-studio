name: Approved George production audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/george_voice.py'
      - 'scripts/local_voice.py'
      - 'tests/test_george_voice.py'
      - '.github/workflows/george-production-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: george-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
      PURFFLE_ENGLISH_NARRATOR: george
      PURFFLE_NATURAL_VOICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y install espeak-ng
          pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps 'purffle-shorts @ git+https://github.com/Chamanrajragu/purffle-shorts.git@514fd2547227b98d951dfc1489fc7c72f1b68'
          pip install 'kokoro==0.9.4' 'soundfile==0.13.1' 'faster-whisper==1.2.1' 'av==14.2.0' 'scipy==1.15.3' 'pytest>=8,<10' 'pydantic>=2,<3' 'pydantic-settings>=2,<3' requests Pillow 'edge-tts==7.3.1' groq python-dotenv httpx rich
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/whisper
          key: george-audit-v2-${{ runner.os }}
      - run: |
          python -m compileall -q scripts
          pytest -q tests/test_george_voice.py
      - name: Actual approved voice and independent speech alignment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from types import SimpleNamespace
          from local_voice import synthesize
          from studio_runtime import _validate_free_speech
          from long_video import real_word_captions
          from purffle_shorts.timing import tokenize
          texts={
              "short":"A volcano can blast rock high into the sky. The force starts deep underground. Molten rock is called magma. It can rise because it is less dense than surrounding rock. Near the surface, pressure drops and gas bubbles expand. Runny magma lets gas escape more easily. Sticky magma can trap that expanding gas, building pressure that drives an explosive eruption.",
              "chapter":"A blue whale can be longer than a city bus. Yet it feeds on tiny animals called krill. It opens its enormous mouth, and the water flows back out through special plates. The krill stay inside. When the whale dives, it has to hold its breath. Its body stores oxygen in the blood and muscles. Then it returns to the surface to breathe again. Although the whale lives in the sea, it breathes air through openings at the top of its head. The size of its body also helps it retain heat in cold water."
          }
          for name,text in texts.items():
              root=Path("approved-george")/name
              speech=synthesize(text,root,SimpleNamespace(language="en"))
              _validate_free_speech(speech,"kokoro","en")
              assert [w.text for w in speech.words]==tokenize(text,"en")
              captions=real_word_captions(speech,0)
              (root/"proof.json").write_text(json.dumps({"provenance":speech.provenance,"duration":speech.duration,"captions":captions},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-george-audio
          path: approved-george/
          retention-days: 7
