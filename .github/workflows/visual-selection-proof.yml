name: Real footage selection and hard negative proof
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/visual-selection-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-selection-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PURFFLE_VLM_SHADOW: '0'
      PURFFLE_CLIP_THRESHOLD: '.22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
      - run: python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'transformers==4.57.1' 'Pillow>=10.1,<14' requests 'sentencepiece>=0.2,<1' 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_visual_selection_proof.py
      - run: python scripts/visual_selection_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-selection-proof
          path: visual-selection-proof/
          if-no-files-found: warn
          retention-days: 7
