# One English lightning Shorts run for user-requested #73/#74 reliability fixes.
# Trigger on this new workflow file's push or allow manual workflow_dispatch.
# The run must not claim success unless the 720p MP4 passes batch validation.
name: Purffle V3 - English Lightning Video After Fixes
run-name: "One English lightning video | #${{ github.run_number }}"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-english-lightning-retry-20261119.yml'

permissions:
  contents: read

jobs:
  single-video:
    name: create-videos | One English lightning video
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run exactly one English lightning video after reliability fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      PURFFLE_COVERR_MAX_CALLS: '5'
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-20b
      SCRIPT_REVIEW: 'off'
      SEO_KEYWORDS: 'false'
      VISUAL_SOURCES: freenaturestock-video,coverr-video,pixabay,pexels,europeana-video,wikimedia-video,nasa-video,archive-video
      PURFFLE_NARRATOR_LOCK: '1'
      PURFFLE_MEDIA_FIRST: '1'
      TTS_ENGINE: edge
      EDGE_TTS_TIMEOUT_SECONDS: '120'
      RESOLUTION: 720x1280
      FPS: '30'
      PRESET: medium
      TRANSITION: none
      KEN_BURNS: 'false'
      COLOR_GRADE: none
      SOUND_EFFECTS: 'false'
      WATERMARK: none  # Remove only PurffleStudios; retain topic hook and word captions
      CAPTION_EMOJI: 'false'
      MUSIC_VOLUME: '0'
      OUTPUT_DIR: output_videos
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MAX_SHOT_SECONDS: '0'
      CREDIT_FOOTAGE: 'true'
      UPLOAD: 'false'
      PURFFLE_API_INTERVAL_SECONDS: '1.6'
      INPUT_1: 'en|Why Do We See Lightning Before We Hear Thunder?'
      INPUT_2: ''
      INPUT_3: ''
      INPUT_4: ''
      INPUT_5: ''
      INPUT_6: ''
      INPUT_7: ''
      INPUT_8: ''
      INPUT_9: ''
      INPUT_10: ''
    steps:
      - uses: actions/checkout@v4
      - name: Enforce approved English voice before installing video tools
        env:
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/english_reference_policy.py --topic "$INPUT_1"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production tools
        run: |
          # Ubuntu GitHub-hosted runners normally have FFmpeg preinstalled.
          # Avoid an unnecessary apt mirror failure (production #74).
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "[TOOLS] Using preinstalled FFmpeg and ffprobe"
          else
            installed=0
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && \
                 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg fonts-dejavu-core; then
                installed=1
                break
              fi
              echo "::warning::Ubuntu mirror failure during FFmpeg install, retry ${attempt}/3"
              sleep $((attempt * 5))
            done
            if [[ "$installed" != 1 ]]; then
              echo "::error::FFmpeg setup failed after three bounded attempts"
              exit 1
            fi
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Install approved reference-only English model and audio validation
        if: startsWith(env.INPUT_1, 'en|')
        run: |
          python -m pip install --no-cache-dir 'faster-whisper==1.2.1' 'resemblyzer==0.1.4' 'av==18.1.0'
          # PyAV 19.x removed 'metadata_errors'; faster-whisper 1.2.1 requires it.
          # Voice smoke #6 succeeded with av==18.1.0. Reject accidental upgrades.
          python -c "import av; assert av.__version__ == '18.1.0', 'Incompatible PyAV version'; print('[VOICE DEPENDENCY] PyAV 18.1.0 pinned for real word timing')"
          python -m venv --system-site-packages .venv-reference
          .venv-reference/bin/python -m pip install --upgrade pip
          .venv-reference/bin/python -m pip install 'torchaudio==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          .venv-reference/bin/python -m pip install --no-cache-dir 'chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@ab55923c27757c90cfcc407baa57dc25a7d25217'
      - name: Live test the approved private English reference voice
        if: startsWith(env.INPUT_1, 'en|')
        env:
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/reference_voice_smoke.py
      - name: Restore verified video and voice model cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v2-model-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Verify and prepare visual dependencies
        run: |
          python -m compileall -q scripts sitecustomize.py
          python scripts/check_model.py
          python scripts/improve_upstream.py
      - name: Verify narrator retries with offline regression tests
        run: PYTHONPATH=scripts:. python -m pytest -q tests/test_english_narrator_retries.py tests/test_approved_reference_voice.py tests/test_pyav_english_voice_compat.py
      - name: Produce exactly one 720p narrated video
        env:
          PURFFLE_STRICT: '1'
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/batch.py
      - name: Prepare consolidated diagnostics and Shorts title
        if: always()
        run: python scripts/aggregate_results.py
      - name: Upload MP4, subtitles, title and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purffle-english-lightning-${{ github.run_number }}
          path: |
            finished/
            batch-results.json
            PURFFLE_DIAGNOSTICS.txt
            PURFFLE_DIAGNOSTICS.json
            YOUTUBE_SHORTS_TITLES.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Verify requested video succeeded
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('batch-results.json')
          if not p.is_file():
              raise SystemExit('Missing batch diagnostics')
          results = json.loads(p.read_text())
          if len(results) != 1:
              raise SystemExit(f'Expected exactly one topic, found {len(results)}')
          row = results[0]
          print(f"[ONE VIDEO] status={row.get('status')} topic={row.get('topic')}")
          if row.get('status') != 'ok':
              raise SystemExit('Video failed; download the artifact for details')
          PY
