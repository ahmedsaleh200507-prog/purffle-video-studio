name: Science source regression (fast, offline)

on:
  pull_request:
    paths:
      - "scripts/science_sources.py"
      - "scripts/fact_checked_topics.py"
      - "tests/test_science_sources.py"
      - ".github/workflows/science-source-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/science_sources.py"
      - "scripts/fact_checked_topics.py"
      - "tests/test_science_sources.py"
      - ".github/workflows/science-source-tests.yml"

permissions:
  contents: read

jobs:
  offline-science-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only lightweight offline test dependencies
        run: python -m pip install "pytest>=8,<10" "requests>=2.31,<3"
      - name: Syntax check and source review regression tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m compileall -q scripts/science_sources.py scripts/fact_checked_topics.py tests/test_science_sources.py
          python -m pytest tests/test_science_sources.py -q
