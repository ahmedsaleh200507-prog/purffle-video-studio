# One-off batch launcher. Fires only when this exact workflow file changes
# with the exact commit message below. Each slot is independently reported.
name: One-time Shorts Batch Launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-aurora-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  launch:
    if: github.event.head_commit.message == 'Launch 10 Shorts production batch'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Dispatch real-video batch (5 German, 5 English)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/videos.yml/dispatches" \
            -f ref=main \
            -f 'inputs[video_1]=de|Warum entstehen Meereswellen?' \
            -f 'inputs[video_2]=de|Warum leuchten Polarlichter?' \
            -f 'inputs[video_3]=de|Was passiert, wenn Lava ins Meer fließt?' \
            -f 'inputs[video_4]=de|Warum beschlägt der Badezimmerspiegel?' \
            -f 'inputs[video_5]=de|Warum leuchtet das Meer nachts blau?' \
            -f 'inputs[video_6]=en|Why Do Steel Ships Float?' \
            -f 'inputs[video_7]=en|Why Do Icebergs Break Apart?' \
            -f 'inputs[video_8]=en|Why Do Whales Jump?' \
            -f 'inputs[video_9]=en|Why Do We See Lightning Before Hearing Thunder?' \
            -f 'inputs[video_10]=en|Why Do Sea Turtles Sleep Underwater?'
          echo '[DISPATCH] Sent 10 separate topics to the real Shorts workflow.'
          gh run list --repo "${GITHUB_REPOSITORY}" --workflow videos.yml --limit 3 --json databaseId,status,conclusion,displayTitle
