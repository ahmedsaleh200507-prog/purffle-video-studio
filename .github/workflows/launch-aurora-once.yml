# One-shot 3-topic Production 94 dispatch; remove after confirmed submission.
name: One-time Production 94 Scene Quality Trial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/launch-aurora-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  launch:
    if: github.event.head_commit.message == 'Launch Production 94 free-footage visual trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Dispatch 3 real-video Shorts to the FREE production pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/videos.yml/dispatches" \
            -f 'inputs[video_1]=de|Was passiert, wenn Lava ins Meer fließt?' \
            -f 'inputs[video_2]=en|Why Do We See Lightning Before Hearing Thunder?' \
            -f 'inputs[video_3]=en|Why Do Icebergs Break Apart?' \
            -f ref=main
          echo '[DISPATCH SUBMITTED] 3 problem topics sent to the existing free video workflow'
