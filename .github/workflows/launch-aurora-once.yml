# One-shot trigger; remove this workflow immediately after dispatch.
name: One-time Free Sources Batch Launcher
on:
  push:
    branches: [main]
    paths: ['.github/workflows/launch-aurora-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  launch:
    if: github.event.head_commit.message == 'Launch Production 93 ten Shorts after free sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Dispatch ten HD stock-video Shorts (5 DE, 5 EN)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/videos.yml/dispatches" \
            -f 'inputs[video_1]=de|Was passiert, wenn Lava ins Meer fließt?' \
            -f 'inputs[video_2]=de|Warum beschlägt der Badezimmerspiegel?' \
            -f 'inputs[video_3]=de|Warum leuchten Polarlichter?' \
            -f 'inputs[video_4]=de|Warum entstehen Meereswellen?' \
            -f 'inputs[video_5]=de|Warum leuchtet das Meer nachts blau?' \
            -f 'inputs[video_6]=en|Why Do Whales Jump?' \
            -f 'inputs[video_7]=en|Why Do We See Lightning Before Hearing Thunder?' \
            -f 'inputs[video_8]=en|Why Do Icebergs Break Apart?' \
            -f 'inputs[video_9]=en|Why Do Sea Turtles Sleep Underwater?' \
            -f 'inputs[video_10]=en|Why Do Steel Ships Float?' \
            -f ref=main
          echo '[DISPATCH SUBMITTED] Real 10-topic production accepted by GitHub API'
