name: Blind bilingual narration model comparison
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/narration-model-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: narration-model-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PURFFLE_SINGLE_PASS_NARRATION: '1'
      PURFFLE_LOCAL_LLM: '0'
      PURFFLE_CONDITIONAL_EDIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal text-only test dependencies
        run: python -m pip install 'requests>=2.32,<3' 'jsonschema>=4.20,<5' 'pytest>=8,<10' 'langdetect==1.0.9'
      - name: Compile and offline regression checks
        run: |
          python -m compileall -q scripts tests/test_story_first.py tests/test_narration_model_benchmark.py
          python -m pytest -q tests/test_story_first.py tests/test_narration_model_benchmark.py
      - name: Compare four exact writers across five topics in English and German
        run: python scripts/narration_model_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-bilingual-narration-comparison
          path: narration-benchmark/
          retention-days: 7
