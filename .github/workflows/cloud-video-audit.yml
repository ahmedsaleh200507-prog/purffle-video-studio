name: Strong free cloud video proof - corrected Groq frame limit
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/cloud-video-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PURFFLE_GEMINI_FREE_CONFIRMED: ${{ vars.PURFFLE_GEMINI_FREE_CONFIRMED }}
      PURFFLE_GROQ_FREE_CONFIRMED: ${{ vars.PURFFLE_GROQ_FREE_CONFIRMED }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
      - run: python -m pip install 'Pillow>=10.1,<14' requests 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_cloud_video_audit.py tests/test_temporal_vision_pilot.py
      - run: python scripts/cloud_video_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-video-audit
          path: cloud-video-audit/
          retention-days: 7
          if-no-files-found: warn
