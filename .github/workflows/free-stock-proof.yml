name: Free Pexels and Pixabay discovery proof
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/free-stock-proof.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  discovery:
    if: github.repository == 'ahmedsaleh200507-prog/purffle-video-studio' && github.ref == 'refs/heads/chatgpt/yellow-system-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
      PURFFLE_PEXELS_FREE_CONFIRMED: ${{ vars.PURFFLE_PEXELS_FREE_CONFIRMED }}
      PURFFLE_PIXABAY_FREE_CONFIRMED: ${{ vars.PURFFLE_PIXABAY_FREE_CONFIRMED }}
      PEXELS_API_KEY: ${{ vars.PURFFLE_PEXELS_FREE_CONFIRMED == '1' && secrets.PEXELS_API_KEY || '' }}
      PIXABAY_API_KEY: ${{ vars.PURFFLE_PIXABAY_FREE_CONFIRMED == '1' && secrets.PIXABAY_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_free_stock_probe.py
      - run: python scripts/free_stock_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-stock-report
          path: free-stock-report.json
          if-no-files-found: warn
