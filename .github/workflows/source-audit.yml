name: '03 - Test All Video Sources'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/source_audit.py'
      - 'scripts/range_segment.py'
      - 'scripts/media_validation.py'
      - 'scripts/portrait_layout.py'
      - 'scripts/studio_runtime.py'
      - 'scripts/footage_search.py'
      - 'tests/test_portrait_priority.py'
      - 'tests/test_portrait_layout.py'
      - 'scripts/video_sources.py'
      - 'tests/test_range_segment.py'
      - 'tests/test_localized_motion.py'
      - '.github/workflows/source-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVER2: ${{ secrets.COVER2 }}
      VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
      PURFFLE_NO_ATTRIBUTION: '1'
      PURFFLE_API_INTERVAL_SECONDS: '1.6'
      RESOLUTION: '1080x1920'
      PURFFLE_SHORTS_CENTER_CROP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg; then
                break
              fi
              sleep $((attempt * 5))
            done
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check partial download implementation
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p test_range_segment.py
          python -m unittest discover -s tests -p test_localized_motion.py
          python -m unittest discover -s tests -p test_portrait_layout.py
          python -m unittest discover -s tests -p test_portrait_priority.py
      - name: Test each provider independently
        run: python scripts/source_audit.py
      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: source-audit/
          if-no-files-found: warn
          retention-days: 7
