name: "TEMP - Gemini API secure live connectivity check"
run-name: "Gemini free API | real response + key never logged"
on:
  push:
    branches:
      - production/gemini-live-test-20261122
    paths:
      - '.github/workflows/gemini-connection-smoke-20261122.yml'
permissions:
  contents: read
jobs:
  verify-gemini:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Verify live Gemini 3.1 Flash-Lite text JSON API without exposing the secret
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request,urllib.error
          key=os.environ.get('GEMINI_API_KEY','')
          if not key:
              print('[GEMINI TEST] missing GitHub secret GEMINI_API_KEY')
              sys.exit(2)
          url='https://generativelanguage.googleapis.com/v1beta/openai/chat/completions'
          payload={'model':'gemini-3.1-flash-lite',
                   'messages':[{'role':'user','content':'Reply ONLY with a JSON object: {"ok":true}'}],
                   'response_format':{'type':'json_object'},
                   'max_tokens':150,'temperature':0.1}
          req=urllib.request.Request(
              url,data=json.dumps(payload).encode('utf-8'),
              headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},
              method='POST')
          try:
              with urllib.request.urlopen(req,timeout=50) as resp:
                  raw=resp.read(20000)
                  status=resp.status
          except urllib.error.HTTPError as exc:
              print(f'[GEMINI TEST] HTTP {exc.code}. The secret is configured but free-tier access, quota, or model permission may be restricted.')
              sys.exit(1)
          except Exception as exc:
              print('[GEMINI TEST] Connection failed:',type(exc).__name__)
              sys.exit(1)
          try:
              parsed=json.loads(raw)
              content=parsed['choices'][0]['message']['content']
              answer=json.loads(content)
              assert answer.get('ok') is True
          except (KeyError,IndexError,ValueError,TypeError,AssertionError) as exc:
              print('[GEMINI TEST] JSON format invalid:',type(exc).__name__)
              sys.exit(1)
          print('[GEMINI TEST] SUCCESS | model=gemini-3.1-flash-lite | real JSON response validated | key hidden')
          PY
