# One-time official MP4 link smoke test: no webpage crawl, no index scraping.
name: Free Nature Stock - Real MP4 CDN Test
run-name: "Free Nature Stock | single approved MP4 download | #${{ github.run_number }}"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freenaturestock-download-smoke-20261119.yml'
permissions:
  contents: read
jobs:
  download-one:
    if: github.event.head_commit.message == 'Verify automatic Free Nature Stock MP4 download'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare downloader dependencies
        run: |
          python -m pip install requests
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Select and really download one approved official MP4
        run: |
          python - <<'PY'
          from dataclasses import dataclass, field
          from pathlib import Path
          import json
          import subprocess
          from video_sources import ProviderRegistry
          from media_validation import VideoDownloader

          @dataclass
          class Item:
              source: str
              id: str
              kind: str
              url: str = ""
              width: int = 0
              height: int = 0
              duration: float = 0
              credit: str = ""
              query: str = ""
              rank: int = 0
              text: str = ""
              extra: dict = field(default_factory=dict)

          reg = ProviderRegistry(Item)
          found = reg.search("freenaturestock-video", "rolling mist clouds")
          assert found, "offline manifest could not select any source"
          item = found[0]
          assert item.url == ("https://cdn.freenaturestock.com/videos/"
                              "freenaturestock-rolling-mist-clouds.mp4")
          assert item.extra["license"]["id"] == "CC0-1.0"
          path = VideoDownloader(
              cache_dir=Path("fns-smoke-downloads"),
              max_bytes=160*1024*1024,
              min_free_bytes=512*1024*1024,
              total_timeout=180,
          ).download(item.url)
          video = json.loads(subprocess.run([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", str(path)
          ], capture_output=True, text=True, check=True, timeout=30).stdout)
          streams = [s for s in video.get("streams", [])
                     if s.get("codec_type") == "video"]
          assert streams, "downloaded file has no actual video stream"
          info = streams[0]
          assert min(int(info["width"]), int(info["height"])) >= 1080
          assert float(video.get("format", {}).get("duration", 0)) >= 8
          result = {
              "state": "verified_official_cdn_download",
              "provider": item.source, "title": item.text,
              "file_bytes": path.stat().st_size,
              "width": int(info["width"]),
              "height": int(info["height"]),
              "duration_seconds": round(float(video["format"]["duration"]), 2),
              "license": item.extra["license"]["id"],
              "url": item.url,
              "claim": "One provider MP4 can be downloaded; no finished Short produced."
          }
          Path("freenaturestock-cdn-report.json").write_text(
              json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result, indent=2), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freenaturestock-cdn-smoke-report
          path: freenaturestock-cdn-report.json
          retention-days: 7
          if-no-files-found: ignore
