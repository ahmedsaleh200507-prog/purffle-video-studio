name: Purffle English narrator real proof (no video)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/english-narrator-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-narrator-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PURFFLE_WHISPER_CACHE: ${{ github.workspace }}/.cache/whisper
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm pinned narrator secret identity without exposing it
        env:
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/english_reference_policy.py --topic 'en|Why Do Steel Ships Float?'
      - name: Install exactly the same narrator dependencies as real production
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-cache-dir 'faster-whisper==1.2.1' 'resemblyzer==0.1.4' 'av==18.1.0'
          python -c "import av; assert av.__version__ == '18.1.0'"
          python -m venv --system-site-packages .venv-reference
          .venv-reference/bin/python -m pip install --upgrade pip
          .venv-reference/bin/python -m pip install 'torchaudio==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          .venv-reference/bin/python -m pip install --no-cache-dir 'chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@ab55923c27757c90cfcc407baa57dc25a7d25217'
      - name: Prove all four actual steel-ship scenes using approved male voice
        env:
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/reference_voice_proof.py
      # No upload-artifact: generated WAV and the private reference are both
      # held only inside TemporaryDirectory and erased on job completion.
      # No footage provider, Groq call, MP4 rendering or YouTube publishing.
