name: 'V4 branch live production trial'
on:
  push:
    branches: [codex/v4-footage-reliability]
    paths: ['.github/workflows/v4-live-trial.yml']
permissions:
  actions: write
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'videos.yml', ref: 'codex/v4-footage-reliability',
              inputs: {
                video_1: 'en|What Happens When Lava Hits the Ocean?',
                video_2: 'de|Warum beschlägt der Badezimmerspiegel?'
              }
            });
