# One-time API/real-MP4 smoke. No stock file or signed JWT is published.
name: Coverr free authentic MP4 API smoke
run-name: "Coverr authentic free MP4 | private key and real file | #${{ github.run_number }}"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coverr-free-video-smoke-20261119.yml'
permissions:
  contents: read
jobs:
  verify-coverr:
    if: github.event.head_commit.message == 'Verify Coverr free original MP4 API'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      PURFFLE_COVERR_MAX_CALLS: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare safe short stock-video download probe
        run: |
          python -m pip install 'requests>=2,<3' 'Pillow>=10,<14'
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Search Coverr with private API key; download real moving MP4 and report usage
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          python - <<'PY'
          from dataclasses import dataclass, field
          from pathlib import Path
          import os
          from video_sources import ProviderRegistry, LicenseValidator, JsonClient
          from media_validation import VideoDownloader, QualityValidator

          @dataclass
          class Item:
              source: str
              id: str
              kind: str
              url: str = ""
              width: int = 0
              height: int = 0
              duration: float = 0
              credit: str = ""
              query: str = ""
              rank: int = 0
              text: str = ""
              extra: dict = field(default_factory=dict)
              @property
              def key(self):
                  return f"{self.source}:{self.id}"

          if not os.environ.get("COVERR_API_KEY", "").strip():
              raise SystemExit("Coverr key missing from GitHub Secrets (key value hidden)")
          registry=ProviderRegistry(Item)
          provider=next(x for x in registry.health() if x["provider"] == "coverr-video")
          assert provider["enabled"], "Coverr not enabled despite private API key"
          candidates=registry.search("coverr-video","ocean waves")
          print(f"[COVERR SAFE PROBE] real-licensed candidates={len(candidates)}")
          if not candidates:
              status=registry.events[-1]["status"] if registry.events else "unknown"
              raise SystemExit("No verifiable original free Coverr video (status="+status+")")
          downloader=VideoDownloader(Path("coverr-private-downloads"),
                                     max_bytes=300*1024*1024,
                                     min_free_bytes=512*1024*1024,
                                     total_timeout=150)
          verified=False
          for item in candidates[:2]:
              try:
                  assert item.kind == "video" and LicenseValidator.validate(item.extra["license"])
                  assert item.extra["license"]["id"] == "COVERR"
                  assert item.extra["license"]["attribution_required"]
                  path=downloader.download(item.url)
                  registry.track_download(item)
                  quality=QualityValidator().validate(path,need=3.0)
                  print(f"[COVERR SAFE RESULT] REAL MP4 verified size={path.stat().st_size} "
                        f"pixels={quality['width']}x{quality['height']} "
                        f"duration={quality['duration']:.2f}s "
                        f"license=COVERR recorded_download=yes "
                        f"source_id={item.id}")
                  verified=True
                  break
              except Exception as exc:
                  # Never log signed URLs, API keys, raw response or token.
                  print(f"[COVERR SAFE REJECTION] source_id={item.id} type={type(exc).__name__}")
          if not verified:
              raise SystemExit("Coverr API searched successfully, but no real acceptable MP4 downloaded/tracked")
          print("[COVERR SAFE RESULT] One real moving stock MP4 and download tracking confirmed; no full Short rendered.")
          PY
      - name: Verify private credentials are not published
        if: always()
        run: echo '[SECURITY] No raw Coverr video, signed download URL or private API key is uploaded.'
