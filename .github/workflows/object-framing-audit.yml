name: '07 - Test Object Framing'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/object_framing.py'
      - 'scripts/object_framing_audit.py'
      - 'tests/test_object_framing.py'
      - '.github/workflows/object-framing-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers==4.57.1' 'Pillow>=10.1,<14' requests
      - name: Install FFmpeg and ffprobe if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::FFmpeg setup failed after three bounded attempts"
                exit 1
              fi
              sleep 5
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - run: python scripts/object_framing_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: object-framing-audit
          path: object-framing-audit/
          if-no-files-found: warn
