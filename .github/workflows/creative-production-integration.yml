name: Creative production integration
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/creative-production-integration.yml','scripts/production_narration.py','tests/test_production_narration.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest requests jsonschema
      - run: python -m compileall -q scripts
      - run: python -m pytest -q tests/test_production_narration.py tests/test_story_room.py
