name: Read-only model access diagnostics
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/provider-access-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_provider_access_audit.py
      - run: python scripts/provider_access_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-access-audit
          path: provider-access-audit/
          if-no-files-found: warn
          retention-days: 7
