name: '02 - Long Video Maker (1-10 videos, EN/DE, 16:9)'
run-name: "Purffle Long Documentaries | Batch #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      video_1:
        description: '1 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: true
        type: string
      video_2:
        description: '2 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_3:
        description: '3 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_4:
        description: '4 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_5:
        description: '5 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_6:
        description: '6 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_7:
        description: '7 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_8:
        description: '8 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_9:
        description: '9 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string
      video_10:
        description: '10 - en|Why do octopuses have three hearts? / de|Warum ist der Himmel blau?'
        required: false
        type: string

permissions:
  contents: read

# Ten independent jobs, ONE active at a time to respect free-tier Groq and
# stock limits. A failed job must not cancel other requested video slots.
# No workflow-wide concurrency group: GitHub may cancel older pending batches.
jobs:
  long-video:
    name: 'Long documentary | slot ${{ matrix.slot }}/10'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slot: 1
            input: video_1
          - slot: 2
            input: video_2
          - slot: 3
            input: video_3
          - slot: 4
            input: video_4
          - slot: 5
            input: video_5
          - slot: 6
            input: video_6
          - slot: 7
            input: video_7
          - slot: 8
            input: video_8
          - slot: 9
            input: video_9
          - slot: 10
            input: video_10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PURFFLE_LOCAL_LLM: '1'
      PURFFLE_LOCAL_QUALITY: '1'
      PURFFLE_CLOUD_MODEL_ROUTER: '1'
      PURFFLE_SIGLIP_REVIEW: '1'
      PURFFLE_VLM_SHADOW: '1'
      PURFFLE_TIMED_LONG_SCENES: '1'
      PURFFLE_EDITORIAL_STANDARD: '1'
      PURFFLE_LONG_LLM_PRIMARY: ${{ vars.PURFFLE_LONG_LLM_PRIMARY || 'gemini' }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVER2: ${{ secrets.COVER2 }}
      # Keep long-form uploads free of assets requiring manual attribution.
      # No license policy is bypassed merely because an API key exists.
      PURFFLE_NO_ATTRIBUTION: '1'
      PURFFLE_VERIFIED_PHOTO_ONLY: '1'
      LLM_MODEL: openai/gpt-oss-20b
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PURFFLE_API_INTERVAL_SECONDS: '1.6'
      # Prefer native HD CDN variants rather than huge unnecessary 4K
      # files that repeatedly exhausted the bounded long-film downloader.
      PURFFLE_LONG_STOCK_HD_VARIANTS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validate independent long-video slot before expensive setup
        id: selected
        env:
          LONG_SLOT_TOPIC: ${{ inputs[matrix.input] }}
        run: python scripts/long_batch_slot.py --slot ${{ matrix.slot }}

      - name: Install Python for selected documentary
        if: steps.selected.outputs.render == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Test long documentary languages and slot isolation
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        run: |
          python -m compileall -q scripts
          python scripts/long_video.py --self-test
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_long_generic.py tests/test_long_batch_slot.py tests/test_long_script.py tests/test_long_video_pipeline.py

      - name: Check fixed Piper Joe/Thorsten policy
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        env:
          VOICE_LANGUAGE: ${{ steps.selected.outputs.language }}
          LONG_TOPIC: ${{ steps.selected.outputs.topic }}
        run: |
          if [[ "$VOICE_LANGUAGE" == 'en' ]]; then
            python scripts/english_reference_policy.py --topic "en|$LONG_TOPIC"
          else
            python - <<'PY'
          from local_voice import provenance
          info=provenance('de')
          assert info["model"]=="de_DE-thorsten-medium"
          assert info["license"]["id"]=="CC0-1.0"
          print("[GERMAN VOICE] pinned CC0 Thorsten model; no voice switching")
          PY
          fi

      - name: Install FFmpeg if absent
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Install pinned media, German Piper and science dependencies
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.6.0+cpu' 'torchvision==0.21.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt 'jsonschema>=4.20,<5' 'sentencepiece>=0.2,<1'

      - name: Restore shared CPU voice and visual model cache
        if: steps.selected.outputs.render == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v4-long-model-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'scripts/local_voice.py', 'scripts/media_validation.py') }}

      - name: Restore verified local Qwen download cache
        if: steps.selected.outputs.render == 'true'
        id: qwen-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/local-llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-fast-v1-${{ runner.os }}
      - name: Restore larger Qwen model cache
        if: steps.selected.outputs.render == 'true'
        id: qwen-quality-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/local-llm/Qwen3-8B-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-quality-v1-${{ runner.os }}
      - name: Restore this run's verified production checkpoint
        if: steps.selected.outputs.render == 'true'
        uses: actions/cache/restore@v4
        with:
          path: long_video_output/checkpoints
          key: purffle-resume-v1-${{ github.sha }}-${{ github.run_id }}-${{ matrix.slot }}-${{ github.run_attempt }}
          restore-keys: |
            purffle-resume-v1-${{ github.sha }}-${{ github.run_id }}-${{ matrix.slot }}-

      - name: Render only this long documentary; never publish automatically
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        env:
          LONG_TOPIC: ${{ steps.selected.outputs.topic }}
          LONG_LANGUAGE: ${{ steps.selected.outputs.language }}
        run: timeout 12600 python scripts/long_video.py --topic "$LONG_TOPIC" --language "$LONG_LANGUAGE"

      - name: Retry unfinished chapters from checkpoint once
        if: always() && steps.selected.outputs.render == 'true'
        continue-on-error: true
        env:
          LONG_TOPIC: ${{ steps.selected.outputs.topic }}
          LONG_LANGUAGE: ${{ steps.selected.outputs.language }}
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          root=Path('long_video_output/result')
          try:
              report=json.loads((root/'report.json').read_text())
              qa=json.loads((root/'output-qa.json').read_text())
              assert report.get('status') in ('ok','review') and qa.get('state')=='passed'
              assert (root/'long-video.mp4').is_file()
          except (OSError,ValueError,KeyError,AssertionError,TypeError):
              raise SystemExit(1)
          PY
          then exit 0; fi
          echo "[RESUME] One bounded retry; reuse only validated checkpoints"
          timeout 3300 python scripts/long_video.py --topic "$LONG_TOPIC" --language "$LONG_LANGUAGE"

      - name: Save Qwen files only if downloaded
        if: always() && steps.selected.outputs.render == 'true' && steps.qwen-cache.outputs.cache-hit != 'true' && hashFiles('.cache/local-llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/local-llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-fast-v1-${{ runner.os }}
      - name: Save larger Qwen files only if downloaded
        if: always() && steps.selected.outputs.render == 'true' && steps.qwen-quality-cache.outputs.cache-hit != 'true' && hashFiles('.cache/local-llm/Qwen3-8B-Q4_K_M.gguf') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/local-llm/Qwen3-8B-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-quality-v1-${{ runner.os }}
      - name: Save verified checkpoints for rerun of this job
        if: always() && steps.selected.outputs.render == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: long_video_output/checkpoints
          key: purffle-resume-v1-${{ github.sha }}-${{ github.run_id }}-${{ matrix.slot }}-${{ github.run_attempt }}

      - name: Preserve completed real-footage chapters after failures (no fake 10-minute slideshow)
        if: always() && steps.selected.outputs.render == 'true'
        env:
          LONG_TOPIC: ${{ steps.selected.outputs.topic }}
          LONG_LANGUAGE: ${{ steps.selected.outputs.language }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          root=Path('long_video_output/result')
          try:
              data=json.loads((root/'report.json').read_text())
              assert data.get('status') in ('ok','review') and (root/'long-video.mp4').is_file()
              assert (root/'long-video.mp4').stat().st_size>1000
              print('[LONG NORMAL PRODUCTION] complete movie exists')
          except (OSError,ValueError,KeyError,AssertionError,TypeError):
              raise SystemExit(1)
          PY
          then exit 0; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg fonts-dejavu-core; then break; fi
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          python scripts/emergency_result.py --mode long --topic "$LONG_TOPIC" --language "$LONG_LANGUAGE"

      - name: Verify real 9–11 minute 1080p MP4 and selected language
        if: steps.selected.outputs.render == 'true'
        env:
          EXPECT_LANGUAGE: ${{ steps.selected.outputs.language }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path('long_video_output/result')
          report=json.loads((root/'report.json').read_text())
          assert report['status'] in ('ok','review') and report['language']==os.environ['EXPECT_LANGUAGE']
          publication=json.loads((root/'documentary-quality.json').read_text())
          assert publication['spoken_words']>=1200
          if report['status']=='ok':
              assert publication['publication_quality']=='narrated_real_footage_validated'
              assert publication['unique_verified_source_videos']>=10
              assert publication['long_silence_gaps_over_5_seconds']==0
          else:
              assert publication['publication_quality']=='review_mixed_media'
              assert (root/'output-qa.json').is_file()
              print('[LONG REVIEW] Mixed-media MP4 delivered; not publication-quality verified')
          path=root/'long-video.mp4'
          # Animated 2D H.264 scenes compress extremely well; size isn't quality.
          # Enforce 10-minute duration, real video+AAC streams and exact HD below.
          assert path.is_file() and path.stat().st_size>100_000
          info=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_streams','-show_format',
              '-of','json',str(path)]))
          duration=float(info['format']['duration'])
          v=next(x for x in info['streams'] if x['codec_type']=='video')
          a=next(x for x in info['streams'] if x['codec_type']=='audio')
          assert 540<=duration<=660 and (v['width'],v['height'])==(1920,1080)
          assert v['codec_name']=='h264' and a['codec_name']=='aac'
          assert not any(x['codec_type']=='subtitle' for x in info['streams'])
          assert (root/'captions.srt').is_file()
          assert (root/'script.json').is_file() and (root/'credits.json').is_file()
          print('[LONG VERIFIED] language',report['language'],'seconds',duration)
          PY

      - name: Upload independent MP4 or exact failure diagnostics
        if: always() && steps.selected.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: long-video-${{ matrix.slot }}-${{ steps.selected.outputs.language }}
          path: |
            long_video_output/result/report.json
            long_video_output/result/long-video.mp4
            long_video_output/result/PARTIAL_REAL_CHAPTERS.mp4
            long_video_output/result/documentary-quality.json
            long_video_output/result/script-quality.json
            long_video_output/result/captions.srt
            long_video_output/result/script.json
            long_video_output/result/credits.json
            long_video_output/result/output-qa.json
            long_video_output/result/completed-chapters.json
            long_video_output/result/timed-visual-plan.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
