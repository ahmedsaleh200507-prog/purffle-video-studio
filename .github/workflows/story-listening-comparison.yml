name: Approved narrator story listening comparison
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths:
      - '.github/workflows/story-listening-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listen:
    if: github.ref == 'refs/heads/chatgpt/yellow-system-fixes'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [en, de]
    env:
      PYTHONPATH: scripts
      LANGUAGE: ${{ matrix.language }}
      PURFFLE_ENGLISH_NARRATOR: george
      PURFFLE_NARRATOR_LOCK: '1'
      PURFFLE_NATURAL_VOICE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing approved voice dependencies
        run: |
          pip install --no-deps 'purffle-shorts @ git+https://github.com/Chamanrajragu/purffle-shorts.git@514fd2547227b98d951dfc1489fc8c7ce72f1b68'
          pip install 'piper-tts[alignment]==1.8.0' numpy 'pydantic>=2,<3' 'pydantic-settings>=2,<3' requests Pillow 'edge-tts==7.3.1' groq python-dotenv httpx rich
          if [ "$LANGUAGE" = en ]; then
            sudo apt-get -qq update
            sudo apt-get -qq -y install espeak-ng
            pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
            pip install 'kokoro==0.9.4' 'soundfile==0.13.1' 'faster-whisper==1.2.1' 'av==14.2.0' 'scipy==1.15.3'
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/whisper
            .cache/piper
          key: story-listen-v1-${{ matrix.language }}-${{ runner.os }}
      - name: Create actual A and B speech with identical narrator and settings
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from types import SimpleNamespace
          from fact_checked_topics import ground_verified_documentary
          from local_voice import synthesize
          from purffle_shorts.timing import tokenize
          lang=os.environ["LANGUAGE"]
          examples={
              "en":("Why Do Volcanoes Erupt?",4,
                  "Some volcanoes explode. Others simply let lava flow. The difference begins deep underground. As molten rock rises, pressure falls and gas bubbles expand. In runny magma, those bubbles can escape more easily. But sticky magma can trap the gas. As pressure builds, what could have been a lava flow can instead become an explosive eruption."),
              "de":("Warum leuchten Polarlichter?",2,
                  "Unsichtbare Teilchen bringen den Nachthimmel zum Leuchten. Wie wird daraus ein farbiger Schleier? Energiereiche Elektronen folgen dem Magnetfeld der Erde in Richtung der Pole. Hoch in der Atmosphäre treffen sie auf Sauerstoff und Stickstoff und geben Energie an die Gase ab. Die Gase setzen diese Energie als Licht frei. Was wir als Polarlicht sehen, beginnt also mit winzigen Elektronen.")
          }
          topic,count,candidate=examples[lang]
          baseline=" ".join(s["narration"] for s in ground_verified_documentary({},topic,lang,scene_count=count)["scenes"])
          assert baseline and candidate and baseline!=candidate
          root=Path("story-listening")
          root.mkdir(exist_ok=True)
          (root/"comparison.json").write_text(json.dumps({"topic":topic,"language":lang,"A":baseline,"B":candidate,"scope":"A is current dossier; B is an experimental human-written-style candidate for listening review, not a production-approved or independently source-verified replacement. No audience retention measurement."},ensure_ascii=False,indent=2),encoding="utf-8")
          for label,script in (("A",baseline),("B",candidate)):
              out=root/label
              out.mkdir(exist_ok=True)
              (out/"script.txt").write_text(script,encoding="utf-8")
              speech=synthesize(script,out,SimpleNamespace(language=lang))
              assert [w.text for w in speech.words]==tokenize(script,lang)
              assert all(0<=w.start<w.end<=speech.duration for w in speech.words)
              (out/"proof.json").write_text(json.dumps({"duration":speech.duration,"provenance":speech.provenance,"word_count":len(speech.words)},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-listening-${{ matrix.language }}
          path: story-listening/
          retention-days: 7
