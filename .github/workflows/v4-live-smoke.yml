name: '92 - INTERNAL | One-time V4 live Shorts acceptance'
# Temporary evidence run, deliberately only when this file is introduced/edited.
on:
  push:
    branches: ['codex/v4-footage-reliability']
    paths:
      - '.github/workflows/v4-live-smoke.yml'
permissions:
  contents: read
jobs:
  real-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVER2: ${{ secrets.COVER2 }}
      PURFFLE_STRICT: '1'
      PURFFLE_MEDIA_FIRST: '1'
      PURFFLE_NARRATOR_LOCK: '1'
      PURFFLE_NO_ATTRIBUTION: '1'
      PURFFLE_AUTO_720_FALLBACK: '1'
      VISUAL_SOURCES: pexels,pixabay,usgs-video,nps-video,wikimedia-video,nasa-video,archive-video,coverr-video,europeana-video,freenaturestock-video
      INPUT_1: 'en|Why do ocean waves form?'
      RESOLUTION: 1080x1920
      FPS: '30'
      PRESET: medium
      TRANSITION: none
      KEN_BURNS: 'false'
      COLOR_GRADE: none
      WATERMARK: none
      MUSIC_VOLUME: '0'
      SOUND_EFFECTS: 'false'
      OUTPUT_DIR: output_videos
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned video production tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Render one genuine, fact-checked English Short
        run: python scripts/batch.py
      - name: Upload genuine MP4 or truthful failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-one-shot-live-evidence
          path: |
            finished/
            batch-results.json
            PURFFLE_DIAGNOSTICS.txt
            PURFFLE_DIAGNOSTICS.json
          retention-days: 7
          if-no-files-found: warn
