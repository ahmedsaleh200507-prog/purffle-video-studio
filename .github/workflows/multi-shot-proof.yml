name: Real multi-shot Full-HD scene proof
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/multi-shot-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: scripts
      RESOLUTION: 1080x1920
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
      - run: pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers==4.57.1' 'accelerate>=1,<2' 'Pillow>=10.1,<14' requests 'pytest>=8,<10' 'sentencepiece>=0.2,<1'
      - run: python -m compileall -q scripts
      - run: python -m pytest -q tests/test_multi_shot.py
      - run: python scripts/multi_shot_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-shot-proof
          path: multi-shot-proof/
          if-no-files-found: warn
          retention-days: 7
