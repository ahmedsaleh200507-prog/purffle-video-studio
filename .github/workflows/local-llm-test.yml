name: '04 - Test Local Qwen CPU'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/local_llm.py'
      - 'scripts/long_llm.py'
      - 'scripts/science_sources.py'
      - 'tests/test_local_llm.py'
      - '.github/workflows/local-llm-test.yml'
permissions:
  contents: read
jobs:
  bilingual:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tier: [fast, quality]
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      PURFFLE_LOCAL_LLM: '1'
      PURFFLE_TEST_MODEL: ${{ matrix.tier }}
      PURFFLE_LOCAL_QUALITY: '1'
      GROQ_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Verify Python syntax and fallback routing
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p test_local_llm.py
      - uses: actions/cache@v4
        with:
          path: |
            .cache/local-llm/*.gguf
            .cache/local-llm/*.tar.gz
          key: purffle-qwen-${{ matrix.tier }}-v1-${{ runner.os }}
      - name: Run actual English and German structured inference with no API keys
        run: python scripts/local_llm.py
      - name: Preserve local startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-qwen-startup-${{ matrix.tier }}
          path: .cache/local-llm/server-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
