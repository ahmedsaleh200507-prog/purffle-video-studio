name: '111 - TEMP | Complete MP4 without LLM or footage'
on:
  push:
    branches: [fix/purffle-footage-recovery]
    paths: ['.github/workflows/offline-proof-111.yml']
permissions:
  contents: read
jobs:
  offline-shorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'pytest>=8,<10'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg espeak; then break; fi
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          # Use explicit FFmpeg duration syntax d=0.3 (not .3).
          ffmpeg -hide_banner -filters | grep ' fade ' | head -n 1 || true
      - name: Test generated MP4 with real ffprobe
        env:
          PYTHONPATH: scripts
        run: |
          python -m pytest -q tests/test_offline_video.py
      - name: Reproduce all FIVE previously missing Shorts with no API
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p demo/01 demo/02 demo/03 demo/04 demo/05
          python scripts/offline_video.py --topic 'How Do Rockets Land Back on Earth?' --language en --mode short --out demo/01/video.mp4
          python scripts/offline_video.py --topic 'Wie entsteht eine Sonnenfinsternis?' --language de --mode short --out demo/02/video.mp4
          python scripts/offline_video.py --topic 'Why Do Meteors Burn Up in the Sky?' --language en --mode short --out demo/03/video.mp4
          python scripts/offline_video.py --topic 'Wie entstehen Tornados?' --language de --mode short --out demo/04/video.mp4
          python scripts/offline_video.py --topic 'Why Does Lava Glow Red?' --language en --mode short --out demo/05/video.mp4
      - name: Verify exact 5 MP4 files without any credentials
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          files=sorted(Path('demo').glob('*/video.mp4'))
          assert len(files)==5
          for path in files:
              data=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_format','-show_streams','-of','json',str(path)]))
              video=next(s for s in data['streams'] if s['codec_type']=='video')
              assert (video['width'],video['height'])==(1080,1920)
              assert video['codec_name']=='h264'
              assert any(s['codec_type']=='audio' for s in data['streams'])
              assert 30<float(data['format']['duration'])<34
              print('VERIFIED FIVE OFFLINE MP4', path, path.stat().st_size)
          PY
      - name: Upload FIVE playable complete Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-offline-shorts-five
          path: demo/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  offline-long:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg espeak; then break; fi
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          # Use explicit FFmpeg duration syntax d=0.3 (not .3).
          ffmpeg -hide_banner -filters | grep ' fade ' | head -n 1 || true
      - name: Reproduce failed Space Telescopes topic as REAL 10-minute full MP4
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p demo-long
          python scripts/offline_video.py \
            --topic 'How Do Space Telescopes Explore the Universe?' \
            --language en --mode long \
            --out demo-long/long-video.mp4
      - name: Strict technical verification
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('demo-long/long-video.mp4')
          x=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(p)]))
          v=next(s for s in x['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'])==(1920,1080)
          assert v['codec_name']=='h264'
          assert any(s['codec_type']=='audio' for s in x['streams'])
          duration=float(x['format']['duration'])
          assert 540 <= duration <= 660
          assert Path('demo-long/captions.srt').is_file()
          print('VERIFIED FULL 10 MINUTE 2D DOCUMENTARY', duration,p.stat().st_size)
          PY
      - name: Upload real complete 10-minute video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-offline-long-space-telescope
          path: demo-long/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
