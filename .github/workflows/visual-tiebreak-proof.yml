name: Real video disagreement adjudication with Qwen VL
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/visual-tiebreak-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
      - run: python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'transformers==4.57.1' 'accelerate>=1,<2' 'Pillow>=10.1,<14' requests 'sentencepiece>=0.2,<1' 'pytest>=8,<10' decord num2words 'av>=14,<17'
      - run: python -m pytest -q tests/test_visual_tiebreak_proof.py tests/test_visual_ensemble_proof.py tests/test_temporal_vision_pilot.py
      - run: python scripts/visual_tiebreak_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-tiebreak-proof
          path: visual-tiebreak-proof/
          retention-days: 7
          if-no-files-found: warn
