name: Production root regressions
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/render_job.py'
      - 'scripts/fact_checked_topics.py'
      - 'scripts/visual_director.py'
      - 'scripts/source_overlay.py'
      - 'scripts/short_recovery.py'
      - '.github/workflows/videos.yml'
      - 'scripts/science_*.py'
      - 'scripts/retention_storyboard.py'
      - 'scripts/editorial_standard.py'
      - 'scripts/editorial_pacing.py'
      - 'scripts/studio_runtime.py'
      - '.github/workflows/long-batch.yml'
      - 'scripts/long_*.py'
      - 'scripts/batch.py'
      - 'scripts/youtube_metadata.py'
      - 'tests/test_root_production.py'
      - 'tests/test_long_video_pipeline.py'
      - 'tests/test_science_salvage.py'
      - '.github/workflows/production-root-regressions.yml'
permissions:
  contents: read
concurrency:
  group: production-root-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pytest>=8,<10' 'Pillow>=10,<14' requests 'jsonschema>=4.20,<5' 'PyYAML>=6,<7'
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
      - run: python -m compileall -q scripts
      - name: Root regressions and long pipeline
        run: |
          python -m pytest -q tests/test_root_production.py tests/test_science_salvage.py tests/test_science_sources.py tests/test_long_generic.py tests/test_long_batch_slot.py tests/test_long_script.py tests/test_long_video_pipeline.py tests/test_aggregate_results.py
