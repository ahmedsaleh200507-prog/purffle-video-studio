name: English narration listening candidates
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/english_voice_listening_audit.py'
      - '.github/workflows/english-voice-listening.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: english-listening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --no-deps 'purffle-shorts @ git+https://github.com/Chamanrajragu/purffle-shorts.git@514fd2547227b98d951dfc1489fc8c7ce72f1b68'
          pip install 'piper-tts[alignment]==1.8.0' 'pytest>=8,<10' numpy 'pydantic>=2,<3' 'pydantic-settings>=2,<3' requests Pillow 'edge-tts==7.3.1' groq python-dotenv httpx rich
      - uses: actions/cache@v4
        with:
          path: .cache/piper
          key: purffle-voice-flow-model-v1-${{ runner.os }}
      - run: python scripts/english_voice_listening_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-voice-listening-candidates
          path: english-listening/
          retention-days: 7
