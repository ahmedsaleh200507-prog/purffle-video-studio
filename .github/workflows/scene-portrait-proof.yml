name: Reviewed scene intervals and real portrait render proof
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/scene-portrait-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [scene_interval_review, portrait_render]
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
      - run: python -m pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'transformers==4.57.1' 'accelerate>=1,<2' 'Pillow>=10.1,<14' requests 'sentencepiece>=0.2,<1' 'pytest>=8,<10' decord num2words 'av>=14,<17'
      - run: python -m pytest -q tests/test_scene_portrait_proof.py
      - run: python scripts/${{ matrix.task }}_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.task }}-proof
          path: |
            scene-interval-review/
            portrait-render-proof/
          retention-days: 7
          if-no-files-found: warn
