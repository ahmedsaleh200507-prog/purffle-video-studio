name: Purffle regression checks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'sitecustomize.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test runner
        run: python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7' 'requests>=2,<3' 'numpy>=1.26,<3' 'Pillow>=10,<14'
      - name: Check diagnostics and scene reconciliation
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q tests/test_batch_root_causes.py tests/test_youtube_titles.py tests/test_aggregate_results.py tests/test_batch.py tests/test_thematic_broll.py tests/test_ten_shorts_resilience.py tests/test_portrait_crop_contract.py tests/test_science_topic_guard.py tests/test_lightning_70.py tests/test_media_first.py tests/test_v3_zip_regressions.py tests/test_v3_71_science_integrity.py tests/test_fixed_male_narrator.py tests/test_v3_topic_german_pexels.py tests/test_science_sources.py tests/test_reference_voice_audition.py tests/test_english_reference_policy.py tests/test_mirror_single_german.py tests/test_domestic_mirror_stock_metadata.py tests/test_two_english_shorts_preparation.py tests/test_freenaturestock_catalog.py tests/test_approved_reference_voice.py tests/test_english_narrator_retries.py tests/test_attention_hook.py tests/test_retention_storyboard.py tests/test_lava_ocean_official_dossier.py tests/test_reference_nano_package_pin.py tests/test_coverr_free_video_api.py tests/test_providers.py tests/test_pyav_english_voice_compat.py tests/test_ocean_waves_official_dossier.py tests/test_ocean_bioluminescence_dossier.py

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install media tools and Python dependencies
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "[CI] Preinstalled ffmpeg OK"
          else
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg; then
                break
              fi
              if [[ "$attempt" == "3" ]]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Syntax and regression tests
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q
      - name: Verify pinned German Thorsten CC0 narrator and native captions
        env:
          PYTHONPATH: scripts:.
          PURFFLE_NARRATOR_LOCK: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from local_voice import synthesize, provenance
          expected = 'de_DE-thorsten-medium'
          voice = provenance('de')
          assert voice['model'] == expected and voice['license']['id'] == 'CC0-1.0'
          speech = synthesize(
              'Der Himmel ist heute wirklich wunderschön.',
              Path('german-voice-smoke'),
              SimpleNamespace(language='de'))
          assert speech.engine == 'piper' and speech.voice == expected
          assert speech.timing == 'aligned'
          assert speech.audio.is_file() and speech.audio.stat().st_size > 10000
          assert speech.duration > 1
          print('PINNED GERMAN THORSTEN VOICE LIVE: OK')
          PY
      # The private English recording and model are validated live only in
      # authorized production jobs with PURFFLE_REFERENCE_OPUS_B64 secret.
      # Never upload private English voice audio as a public PR artifact.
