name: Purffle regression checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'sitecustomize.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test runner
        run: python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Check diagnostics and scene reconciliation
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q tests/test_batch_root_causes.py tests/test_youtube_titles.py tests/test_aggregate_results.py tests/test_batch.py tests/test_thematic_broll.py tests/test_ten_shorts_resilience.py tests/test_portrait_crop_contract.py tests/test_science_topic_guard.py tests/test_lightning_70.py tests/test_media_first.py tests/test_v3_zip_regressions.py tests/test_v3_71_science_integrity.py tests/test_fixed_male_narrator.py

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Syntax and regression tests
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q
      - name: Verify actual pinned CC0 male voice model and native captions
        env:
          PURFFLE_NARRATOR_LOCK: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from local_voice import synthesize, provenance
          expected = 'en_US-joe-medium'
          voice = provenance('en')
          assert voice['model'] == expected and voice['license']['id'] == 'CC0'
          speech = synthesize(
              'The northern lights glow above the mountains tonight.',
              Path('male-voice-smoke'),
              SimpleNamespace(language='en'))
          assert speech.engine == 'piper' and speech.voice == expected
          assert speech.timing == 'aligned'
          assert len(speech.words) == 8
          assert speech.audio.is_file() and speech.audio.stat().st_size > 10000
          assert speech.duration > 1
          print('PINNED MALE VOICE LIVE: OK', expected, speech.duration)
          PY
      - name: Upload male narrator listening sample
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: male-narrator-sample
          path: male-voice-smoke/voice-piper.wav
          if-no-files-found: error
          retention-days: 7
