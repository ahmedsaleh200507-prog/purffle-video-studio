name: Purffle regression checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'sitecustomize.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Check diagnostics and scene reconciliation
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q tests/test_batch_root_causes.py tests/test_youtube_titles.py tests/test_aggregate_results.py tests/test_batch.py

  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Syntax and regression tests
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q
