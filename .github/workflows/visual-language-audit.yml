name: '08 - Test Visual Language Models'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/visual_language_audit.py'
      - 'scripts/visual_language_review.py'
      - 'scripts/media_validation.py'
      - 'tests/test_visual_language_review.py'
      - '.github/workflows/visual-language-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [florence, qwen]
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers==4.57.1' 'Pillow>=10.1,<14' requests
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p test_visual_language_review.py
      - run: python scripts/visual_language_audit.py --model ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-language-${{ matrix.model }}
          path: visual-language-audit/
          if-no-files-found: warn
