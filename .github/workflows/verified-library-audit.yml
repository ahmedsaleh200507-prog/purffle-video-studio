name: '13 - Test Verified Source Library'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verified_library.py'
      - 'tests/test_verified_library.py'
      - '.github/workflows/verified-library-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests 'Pillow>=10.1,<14'
      - run: python -m compileall -q scripts
      - run: python -m unittest discover -v -s tests -p test_verified_library.py
