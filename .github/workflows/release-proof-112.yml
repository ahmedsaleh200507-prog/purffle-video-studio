name: '112 - TEMP | Release syntax and offline routing check'
on:
  push:
    branches: [fix/purffle-footage-recovery]
    paths: ['.github/workflows/release-proof-112.yml']
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13' 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Verify Python code and both production YAML files
        env:
          PYTHONPATH: scripts
        run: |
          python -m compileall -q scripts
          python - <<'PY'
          import yaml
          for name in ('.github/workflows/videos.yml',
                       '.github/workflows/long-batch.yml'):
              data=yaml.safe_load(open(name,encoding='utf8'))
              assert isinstance(data['jobs'],dict)
              print('PRODUCTION WORKFLOW YAML VALID',name)
          from offline_video import _text_scenes
          assert len(_text_scenes('Why Does Lava Glow Red?', 'en', 'short')[1]) == 4
          assert len(_text_scenes('How Do Space Telescopes Explore the Universe?', 'en', 'long')[1]) == 14
          from emergency_result import shorts,long
          print('FALLBACK ROUTING IMPORTS VERIFIED')
          PY
          python -m pytest -q tests/test_offline_video.py -k 'not complete'
