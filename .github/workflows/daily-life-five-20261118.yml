name: Purffle V3 - Five Daily Life Shorts
# Show a distinct, explicit manual production run rather than the latest PR title.
run-name: "Five Daily Life Shorts | Production #${{ github.run_number }}"
# Explicit one-off, branch-scoped production request from chat.
# Does NOT start on unrelated main pushes or trigger the normal manual workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-life-five-20261118.yml'

permissions:
  contents: read
# No workflow-wide concurrency lock. With a constant group GitHub allows only
# ONE pending run and silently cancels older pending runs (#63/#64 when #65
# was triggered). The ten video matrix jobs are already throttled below to
# max-parallel: 2 per run. Do not add a constant top-level concurrency group.
jobs:
  create-videos:
    name: create-videos | Video ${{ matrix.slot }} of 10
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    if: github.event.head_commit.message == 'Run Purffle Daily Life five videos 20261118'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slot: 1
            input: video_1
            topic: 'en|Why Do Onions Make You Cry?'
          - slot: 2
            input: video_2
            topic: 'en|Why Does Your Bathroom Mirror Fog Up?'
          - slot: 3
            input: video_3
            topic: 'en|Why Does Your Phone Battery Drain Faster in the Cold?'
          - slot: 4
            input: video_4
            topic: 'en|Why Can Coffee Make You Feel Sleepy?'
          - slot: 5
            input: video_5
            topic: 'en|Why Do Your Fingers Wrinkle in Water?'
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      PURFFLE_COVERR_MAX_CALLS: '5'
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-20b
      SCRIPT_REVIEW: 'off'
      SEO_KEYWORDS: 'false'
      VISUAL_SOURCES: freenaturestock-video,coverr-video,pixabay,pexels,europeana-video,wikimedia-video,nasa-video,archive-video
      # English strictly requires user-approved private reference voice; no Joe fallback.
      # German remains pinned de_DE-thorsten-medium; no female fallback.
      PURFFLE_NARRATOR_LOCK: '1'
      TTS_ENGINE: edge
      EDGE_TTS_TIMEOUT_SECONDS: '120'
      RESOLUTION: 720x1280
      FPS: '30'
      PRESET: medium
      TRANSITION: none
      KEN_BURNS: 'false'
      COLOR_GRADE: none
      SOUND_EFFECTS: 'false'
      WATERMARK: none  # Remove only PurffleStudios; retain topic hook and word captions
      CAPTION_EMOJI: 'false'
      MUSIC_VOLUME: '0'
      OUTPUT_DIR: output_videos
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MAX_SHOT_SECONDS: '0'
      CREDIT_FOOTAGE: 'true'
      UPLOAD: 'false'
      PURFFLE_API_INTERVAL_SECONDS: '1.6'
      INPUT_1: ${{ matrix.slot == 1 && matrix.topic || '' }}
      INPUT_2: ${{ matrix.slot == 2 && matrix.topic || '' }}
      INPUT_3: ${{ matrix.slot == 3 && matrix.topic || '' }}
      INPUT_4: ${{ matrix.slot == 4 && matrix.topic || '' }}
      INPUT_5: ${{ matrix.slot == 5 && matrix.topic || '' }}
      INPUT_6: ${{ matrix.slot == 6 && matrix.topic || '' }}
      INPUT_7: ${{ matrix.slot == 7 && matrix.topic || '' }}
      INPUT_8: ${{ matrix.slot == 8 && matrix.topic || '' }}
      INPUT_9: ${{ matrix.slot == 9 && matrix.topic || '' }}
      INPUT_10: ${{ matrix.slot == 10 && matrix.topic || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check requested video slot
        id: selected
        env:
          SLOT_TOPIC: ${{ matrix.topic }}
        run: |
          if [[ -n "${SLOT_TOPIC//[[:space:]]/}" ]]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Video slot ${{ matrix.slot }} has a topic; production enabled."
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Video slot ${{ matrix.slot }} is blank; skipping setup and render."
          fi
      - name: Enforce approved English voice before installing video tools
        if: steps.selected.outputs.render == 'true'
        env:
          SLOT_TOPIC: ${{ matrix.topic }}
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/english_reference_policy.py --topic "$SLOT_TOPIC"
      - uses: actions/setup-python@v5
        if: steps.selected.outputs.render == 'true'
        with:
          python-version: '3.12'
      - name: Install video tools
        if: steps.selected.outputs.render == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Install approved reference-only English model and audio validation
        if: steps.selected.outputs.render == 'true' && startsWith(matrix.topic, 'en|')
        run: |
          python -m pip install --no-cache-dir 'faster-whisper==1.2.1' 'resemblyzer==0.1.4' 'av==18.1.0'
          # PyAV 19.x removed 'metadata_errors'; faster-whisper 1.2.1 requires it.
          # Voice smoke #6 succeeded with av==18.1.0. Reject accidental upgrades.
          python -c "import av; assert av.__version__ == '18.1.0', 'Incompatible PyAV version'; print('[VOICE DEPENDENCY] PyAV 18.1.0 pinned for real word timing')"
          python -m venv --system-site-packages .venv-reference
          .venv-reference/bin/python -m pip install --upgrade pip
          .venv-reference/bin/python -m pip install 'torchaudio==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          .venv-reference/bin/python -m pip install --no-cache-dir 'chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@ab55923c27757c90cfcc407baa57dc25a7d25217'
      - name: Live test the approved private English reference voice
        if: steps.selected.outputs.render == 'true' && startsWith(matrix.topic, 'en|')
        env:
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/reference_voice_smoke.py
      - name: Restore local model cache
        if: steps.selected.outputs.render == 'true'
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v2-model-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Restore API metadata cache
        if: steps.selected.outputs.render == 'true'
        uses: actions/cache/restore@v4
        with:
          path: media_cache/api
          key: purffle-v2-api-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slot }}
          restore-keys: |
            purffle-v2-api-${{ runner.os }}-
      - name: Syntax and regression tests
        if: steps.selected.outputs.render == 'true'
        run: python -m compileall -q scripts sitecustomize.py
      - name: Live provider API health (no footage downloads)
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        run: python scripts/provider_health.py
      - name: Verify local visual model
        if: steps.selected.outputs.render == 'true'
        run: python scripts/check_model.py
      - name: Verify pinned upstream compatibility
        if: steps.selected.outputs.render == 'true'
        run: python scripts/improve_upstream.py
      - name: Produce selected video
        if: steps.selected.outputs.render == 'true'
        env:
          PURFFLE_STRICT: '1'
          PURFFLE_REFERENCE_OPUS_B64: ${{ secrets.PURFFLE_REFERENCE_OPUS_B64 }}
        run: python scripts/batch.py
      - name: Save local models even when production fails
        if: always() && steps.selected.outputs.render == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v2-model-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Save API responses and quota cooldowns
        if: always() && steps.selected.outputs.render == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: media_cache/api
          key: purffle-v2-api-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slot }}
      - name: Remove transient render work
        if: always() && steps.selected.outputs.render == 'true'
        run: find finished -type d -name work -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Upload the selected video and diagnostic files
        if: always() && steps.selected.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: purffle-part-${{ matrix.slot }}
          path: |
            finished/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  collect-results:
    name: create-videos
    if: always() && github.event.head_commit.message == 'Run Purffle Daily Life five videos 20261118'
    needs: create-videos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      INPUT_1: 'en|Why Do Onions Make You Cry?'
      INPUT_2: 'en|Why Does Your Bathroom Mirror Fog Up?'
      INPUT_3: 'en|Why Does Your Phone Battery Drain Faster in the Cold?'
      INPUT_4: 'en|Why Can Coffee Make You Feel Sleepy?'
      INPUT_5: 'en|Why Do Your Fingers Wrinkle in Water?'
      INPUT_6: ''
      INPUT_7: ''
      INPUT_8: ''
      INPUT_9: ''
      INPUT_10: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gather completed videos (including from failed jobs)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: purffle-part-*
          path: finished
          merge-multiple: true
          # Still write a per-topic failure report if a runner produced no artifact.
      - name: Produce one batch report and all Shorts titles
        run: python scripts/aggregate_results.py
      - name: Save MP4 files and consolidated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purffle-videos-${{ github.run_number }}
          path: |
            finished/
            batch-results.json
            PURFFLE_DIAGNOSTICS.txt
            PURFFLE_DIAGNOSTICS.json
            YOUTUBE_SHORTS_TITLES.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Check whether all requested videos succeeded
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result_file = Path('batch-results.json')
          if not result_file.is_file():
              raise SystemExit('Batch report missing; no results collected')
          results = json.loads(result_file.read_text(encoding='utf-8'))
          if not results:
              raise SystemExit('No video topics were supplied')
          ok = sum(row.get('status') == 'ok' for row in results)
          print(f'[BATCH FINAL] successful={ok} requested={len(results)}')
          if ok != len(results):
              raise SystemExit('Some videos failed; download the ZIP to see which ones')
          PY
