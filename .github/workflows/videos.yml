name: '01 - Shorts Video Maker (9:16)'
# Show a distinct, explicit manual production run rather than the latest PR title.
run-name: "Purffle Shorts | Production #${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      video_1:
        description: '1 - en|Why is the sky blue? / de|Warum ist der Himmel blau?'
        required: true
        type: string
      video_2:
        description: '2 - en|Topic or de|Thema'
        required: false
        type: string
      video_3:
        description: '3 - en|Topic or de|Thema'
        required: false
        type: string
      video_4:
        description: '4 - en|Topic or de|Thema'
        required: false
        type: string
      video_5:
        description: '5 - en|Topic or de|Thema'
        required: false
        type: string
      video_6:
        description: '6 - en|Topic or de|Thema'
        required: false
        type: string
      video_7:
        description: '7 - en|Topic or de|Thema'
        required: false
        type: string
      video_8:
        description: '8 - en|Topic or de|Thema'
        required: false
        type: string
      video_9:
        description: '9 - en|Topic or de|Thema'
        required: false
        type: string
      video_10:
        description: '10 - en|Topic or de|Thema'
        required: false
        type: string
permissions:
  contents: read
# No workflow-wide concurrency lock. With a constant group GitHub allows only
# ONE pending run and silently cancels older pending runs (#63/#64 when #65
# was triggered). The ten video matrix jobs are already throttled below to
# max-parallel: 1 per run to prevent multiple jobs jointly exhausting the
# same Groq free-tier tokens-per-minute budget. Do not add a global lock.
jobs:
  create-videos:
    name: create-videos | Video ${{ matrix.slot }} of 10
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slot: 1
            input: video_1
          - slot: 2
            input: video_2
          - slot: 3
            input: video_3
          - slot: 4
            input: video_4
          - slot: 5
            input: video_5
          - slot: 6
            input: video_6
          - slot: 7
            input: video_7
          - slot: 8
            input: video_8
          - slot: 9
            input: video_9
          - slot: 10
            input: video_10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PURFFLE_LOCAL_LLM: '1'
      PURFFLE_LOCAL_QUALITY: '1'
      PURFFLE_CLOUD_MODEL_ROUTER: '1'
      PURFFLE_SIGLIP_REVIEW: '1'
      PURFFLE_VLM_SHADOW: '1'
      PURFFLE_ADVANCED_VISUALS: '0'  # enabled after optional dependency checks
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVER2: ${{ secrets.COVER2 }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
      PURFFLE_COVERR_MAX_CALLS: '5'
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-20b
      SCRIPT_REVIEW: 'off'
      SEO_KEYWORDS: 'false'
      # Stock search is deadline-bounded (75 sec/scene). Consult two broad,
      # working video indexes before tiny fixed catalogs or slower archives.
      # Remaining providers are still checked when the first ones have no
      # verified, relevant HD clip; license and CLIP checks stay unchanged.
      VISUAL_SOURCES: pexels,pixabay,usgs-video,nps-video,wikimedia-video,nasa-video,archive-video,coverr-video,europeana-video,freenaturestock-video,vecteezy-video
      # V4 fixed Piper Joe/Thorsten; no alternate voice or private model setup.
      PURFFLE_NARRATOR_LOCK: '1'
      TTS_ENGINE: piper
      EDGE_TTS_TIMEOUT_SECONDS: '120'
      RESOLUTION: 1080x1920
      PURFFLE_SHORTS_CENTER_CROP: '1'  # Default; verified object proposals can override
      PURFFLE_SMART_CROP: '1'
      PURFFLE_ACTION_WINDOW: '1'
      PURFFLE_DYNAMIC_CROP: '1'  # Guarded; static fallback on failed derived validation
      PURFFLE_VERIFIED_LIBRARY: '1'
      PURFFLE_EVENT_THEME_REVIEW: '1'
      PURFFLE_SHORTS_PORTRAIT_FIRST: '1'
      PURFFLE_AUTO_720_FALLBACK: '0'
      PURFFLE_REAL_ONLY_RECOVERY: '1'
      PURFFLE_VERIFIED_PHOTO_ONLY: '1'
      FPS: '30'
      PRESET: medium
      TRANSITION: none
      KEN_BURNS: 'false'
      COLOR_GRADE: none
      SOUND_EFFECTS: 'false'
      WATERMARK: none  # Remove only PurffleStudios; retain topic hook and word captions
      CAPTION_EMOJI: 'false'
      MUSIC_VOLUME: '0'
      OUTPUT_DIR: output_videos
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MAX_SHOT_SECONDS: '0'
      CREDIT_FOOTAGE: 'true'
      # Do not select assets that require a manual YouTube attribution.
      PURFFLE_NO_ATTRIBUTION: '1'
      UPLOAD: 'false'
      PURFFLE_API_INTERVAL_SECONDS: '1.6'
      INPUT_1: ${{ matrix.slot == 1 && inputs.video_1 || '' }}
      INPUT_2: ${{ matrix.slot == 2 && inputs.video_2 || '' }}
      INPUT_3: ${{ matrix.slot == 3 && inputs.video_3 || '' }}
      INPUT_4: ${{ matrix.slot == 4 && inputs.video_4 || '' }}
      INPUT_5: ${{ matrix.slot == 5 && inputs.video_5 || '' }}
      INPUT_6: ${{ matrix.slot == 6 && inputs.video_6 || '' }}
      INPUT_7: ${{ matrix.slot == 7 && inputs.video_7 || '' }}
      INPUT_8: ${{ matrix.slot == 8 && inputs.video_8 || '' }}
      INPUT_9: ${{ matrix.slot == 9 && inputs.video_9 || '' }}
      INPUT_10: ${{ matrix.slot == 10 && inputs.video_10 || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check requested video slot
        id: selected
        env:
          SLOT_TOPIC: ${{ inputs[matrix.input] }}
        run: |
          if [[ -n "${SLOT_TOPIC//[[:space:]]/}" ]]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Video slot ${{ matrix.slot }} has a topic; production enabled."
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "Video slot ${{ matrix.slot }} is blank; skipping setup and render."
          fi
      - name: Reject combined topics before costly setup
        if: steps.selected.outputs.render == 'true'
        env:
          SLOT_TOPIC: ${{ inputs[matrix.input] }}
        run: |
          python - <<'PY'
          import os
          from scripts.batch import parse_topic
          language, topic = parse_topic(os.environ["SLOT_TOPIC"])
          print(f"[TOPIC VALIDATED] one {language} topic, {len(topic)} characters")
          PY
      - name: Verify fixed Piper voice policy before installing video tools
        if: steps.selected.outputs.render == 'true'
        env:
          SLOT_TOPIC: ${{ inputs[matrix.input] }}
        run: python scripts/english_reference_policy.py --topic "$SLOT_TOPIC"
      - uses: actions/setup-python@v5
        if: steps.selected.outputs.render == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install video tools
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true  # Emergency 2D producer works without torch/CLIP
        run: |
          # Ubuntu GitHub-hosted runners normally have FFmpeg preinstalled.
          # Avoid an unnecessary apt mirror failure (production #74).
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "[TOOLS] Using preinstalled FFmpeg and ffprobe"
          else
            installed=0
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && \
                 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg fonts-dejavu-core; then
                installed=1
                break
              fi
              echo "::warning::Ubuntu mirror failure during FFmpeg install, retry ${attempt}/3"
              sleep $((attempt * 5))
            done
            if [[ "$installed" != 1 ]]; then
              echo "::error::FFmpeg setup failed after three bounded attempts"
              exit 1
            fi
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt 'jsonschema>=4.20,<5' 'sentencepiece>=0.2,<1'
      - name: Enable validated optional CPU vision tools
        if: steps.selected.outputs.render == 'true'
        run: |
          if python -m pip install -r requirements-advanced-visuals.txt && python -c 'import supervision,scenedetect,faiss,cv2'; then
            echo 'PURFFLE_ADVANCED_VISUALS=1' >> "$GITHUB_ENV"
          else
            echo 'PURFFLE_ADVANCED_VISUALS=0' >> "$GITHUB_ENV"
            echo '::warning::Optional advanced tools unavailable; existing visual gates remain active'
          fi
      - name: Restore local model cache
        if: steps.selected.outputs.render == 'true'
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v4-model-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'scripts/local_voice.py', 'scripts/media_validation.py') }}
      - name: Restore verified local Qwen download cache
        if: steps.selected.outputs.render == 'true'
        id: qwen-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/local-llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-fast-v1-${{ runner.os }}
      - name: Restore larger Qwen model cache
        if: steps.selected.outputs.render == 'true'
        id: qwen-quality-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/local-llm/Qwen3-8B-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-quality-v1-${{ runner.os }}
      - name: Restore public-domain verified source index
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: media_cache/verified-library/index.json
          key: purffle-public-source-index-v1-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slot }}
          restore-keys: |
            purffle-public-source-index-v1-${{ runner.os }}-
      - name: Restore API metadata cache
        if: steps.selected.outputs.render == 'true'
        uses: actions/cache/restore@v4
        with:
          path: media_cache/api
          key: purffle-v2-api-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slot }}
          restore-keys: |
            purffle-v2-api-${{ runner.os }}-
      - name: Syntax and regression tests
        if: steps.selected.outputs.render == 'true'
        run: python -m compileall -q scripts sitecustomize.py
      - name: Live provider API health (no footage downloads)
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true
        run: python scripts/provider_health.py
      - name: Verify local visual model
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true  # No-model 2D fallback still renders full MP4
        run: python scripts/check_model.py
      - name: Verify pinned upstream compatibility
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true  # No-model 2D fallback still renders full MP4
        run: python scripts/improve_upstream.py
      - name: Produce selected video
        if: steps.selected.outputs.render == 'true'
        continue-on-error: true  # Real fallback is checked in next step
        env:
          PURFFLE_STRICT: '1'
        run: python scripts/batch.py
      - name: Recover verified real media after production errors
        if: always() && steps.selected.outputs.render == 'true'
        env:
          SLOT_TOPIC: ${{ inputs[matrix.input] }}
          SLOT_INDEX: ${{ matrix.slot }}
          PURFFLE_LAST_RESORT_GRAPHICS: '1'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
        run: |
          # A normal successful MP4 is always preferred.
          if python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path('finished')/('video_%02d' % int(os.environ['SLOT_INDEX']))/'report.json'
          try:
              report=json.loads(p.read_text())
              mp4=Path(report['mp4'])
              assert report['status'] in ('ok','review') and mp4.is_file() and mp4.stat().st_size>1000
              print('[NORMAL PRODUCTION] valid MP4 preserved')
          except (OSError,ValueError,KeyError,AssertionError,TypeError):
              raise SystemExit(1)
          PY
          then exit 0; fi
          python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg fonts-dejavu-core; then break; fi
            done
          fi
          command -v ffmpeg
          command -v ffprobe
          python scripts/emergency_result.py --mode short --topic "$SLOT_TOPIC" --slot "$SLOT_INDEX"
      - name: Save Qwen files only if downloaded
        if: always() && steps.selected.outputs.render == 'true' && steps.qwen-cache.outputs.cache-hit != 'true' && hashFiles('.cache/local-llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/local-llm/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-fast-v1-${{ runner.os }}
      - name: Save larger Qwen files only if downloaded
        if: always() && steps.selected.outputs.render == 'true' && steps.qwen-quality-cache.outputs.cache-hit != 'true' && hashFiles('.cache/local-llm/Qwen3-8B-Q4_K_M.gguf') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/local-llm/Qwen3-8B-Q4_K_M.gguf
            .cache/local-llm/llama-b12644.tar.gz
          key: purffle-qwen-quality-v1-${{ runner.os }}
      - name: Save local models even when production fails
        if: always() && steps.selected.outputs.render == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v4-model-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'scripts/local_voice.py', 'scripts/media_validation.py') }}
      - name: Save public-domain verified source index
        if: always() && steps.selected.outputs.render == 'true' && hashFiles('media_cache/verified-library/index.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: media_cache/verified-library/index.json
          key: purffle-public-source-index-v1-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slot }}
      - name: Save API responses and quota cooldowns
        if: always() && steps.selected.outputs.render == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: media_cache/api
          key: purffle-v2-api-${{ runner.os }}-${{ github.run_id }}-${{ matrix.slot }}
      - name: Remove transient render work
        if: always() && steps.selected.outputs.render == 'true'
        run: |
          find finished -type d \( -name work -o -name real-recovery \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf media_cache/downloads
      - name: Upload the selected video and diagnostic files
        if: always() && steps.selected.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: purffle-part-${{ matrix.slot }}
          path: |
            finished/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  collect-results:
    name: create-videos
    if: always()
    needs: create-videos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      INPUT_1: ${{ inputs.video_1 }}
      INPUT_2: ${{ inputs.video_2 }}
      INPUT_3: ${{ inputs.video_3 }}
      INPUT_4: ${{ inputs.video_4 }}
      INPUT_5: ${{ inputs.video_5 }}
      INPUT_6: ${{ inputs.video_6 }}
      INPUT_7: ${{ inputs.video_7 }}
      INPUT_8: ${{ inputs.video_8 }}
      INPUT_9: ${{ inputs.video_9 }}
      INPUT_10: ${{ inputs.video_10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gather completed videos (including from failed jobs)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: purffle-part-*
          path: finished
          merge-multiple: true
          # Still write a per-topic failure report if a runner produced no artifact.
      - name: Produce one batch report and all Shorts titles
        run: python scripts/aggregate_results.py
      - name: Save MP4 files and consolidated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purffle-videos-${{ github.run_number }}
          path: |
            finished/
            batch-results.json
            PURFFLE_DIAGNOSTICS.txt
            PURFFLE_DIAGNOSTICS.json
            YOUTUBE_SHORTS_TITLES.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Check whether all requested videos succeeded
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result_file = Path('batch-results.json')
          if not result_file.is_file():
              raise SystemExit('Batch report missing; no results collected')
          results = json.loads(result_file.read_text(encoding='utf-8'))
          if not results:
              raise SystemExit('No video topics were supplied')
          ok = sum(row.get('status') == 'ok' for row in results)
          review = sum(row.get('status') == 'review' for row in results)
          print(f'[BATCH FINAL] verified={ok} review={review} failed={len(results)-ok-review} requested={len(results)}')
          if ok != len(results):
              raise SystemExit('Some videos failed; download the ZIP to see which ones')
          PY
