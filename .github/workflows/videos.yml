name: Purffle V2 - 1 to 10 Videos
on:
  workflow_dispatch:
    inputs:
      video_1:
        description: '1 - en|Why is the sky blue? / de|Warum ist der Himmel blau?'
        required: true
        type: string
      video_2:
        description: '2 - en|Topic or de|Thema'
        required: false
        type: string
      video_3:
        description: '3 - en|Topic or de|Thema'
        required: false
        type: string
      video_4:
        description: '4 - en|Topic or de|Thema'
        required: false
        type: string
      video_5:
        description: '5 - en|Topic or de|Thema'
        required: false
        type: string
      video_6:
        description: '6 - en|Topic or de|Thema'
        required: false
        type: string
      video_7:
        description: '7 - en|Topic or de|Thema'
        required: false
        type: string
      video_8:
        description: '8 - en|Topic or de|Thema'
        required: false
        type: string
      video_9:
        description: '9 - en|Topic or de|Thema'
        required: false
        type: string
      video_10:
        description: '10 - en|Topic or de|Thema'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: purffle-video-studio
  cancel-in-progress: false
jobs:
  create-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-20b
      SCRIPT_REVIEW: 'off'
      SEO_KEYWORDS: 'false'
      VISUAL_SOURCES: pixabay,pexels,coverr-video,europeana-video,wikimedia-video,nasa-video,archive-video
      TTS_ENGINE: edge
      EDGE_TTS_TIMEOUT_SECONDS: '120'
      RESOLUTION: 720x1280
      FPS: '30'
      PRESET: medium
      TRANSITION: none
      KEN_BURNS: 'false'
      COLOR_GRADE: none
      SOUND_EFFECTS: 'false'
      CAPTION_EMOJI: 'false'
      MUSIC_VOLUME: '0'
      OUTPUT_DIR: output_videos
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      MAX_SHOT_SECONDS: '0'
      CREDIT_FOOTAGE: 'true'
      UPLOAD: 'false'
      INPUT_1: ${{ inputs.video_1 }}
      INPUT_2: ${{ inputs.video_2 }}
      INPUT_3: ${{ inputs.video_3 }}
      INPUT_4: ${{ inputs.video_4 }}
      INPUT_5: ${{ inputs.video_5 }}
      INPUT_6: ${{ inputs.video_6 }}
      INPUT_7: ${{ inputs.video_7 }}
      INPUT_8: ${{ inputs.video_8 }}
      INPUT_9: ${{ inputs.video_9 }}
      INPUT_10: ${{ inputs.video_10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Restore local model cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v2-model-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Restore API metadata cache
        uses: actions/cache/restore@v4
        with:
          path: media_cache/api
          key: purffle-v2-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            purffle-v2-api-${{ runner.os }}-
      - name: Syntax and regression tests
        run: |
          python -m compileall -q scripts sitecustomize.py
          python -m pytest -q
      - name: Live provider API health (no footage downloads)
        continue-on-error: true
        run: python scripts/provider_health.py
      - name: Verify local visual model
        run: python scripts/check_model.py
      - name: Verify pinned upstream compatibility
        run: python scripts/improve_upstream.py
      - name: Produce up to 10 videos
        env:
          PURFFLE_STRICT: '1'
        run: python scripts/batch.py
      - name: Save local models even when production fails
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/huggingface
            .cache/piper
          key: purffle-v2-model-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
      - name: Save API responses and quota cooldowns
        if: always()
        uses: actions/cache/save@v4
        with:
          path: media_cache/api
          key: purffle-v2-api-${{ runner.os }}-${{ github.run_id }}
      - name: Remove transient render work
        if: always()
        run: find finished -type d -name work -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Save MP4 files and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purffle-videos-${{ github.run_number }}
          path: |
            finished/
            batch-results.json
            PURFFLE_DIAGNOSTICS.txt
            PURFFLE_DIAGNOSTICS.json
            YOUTUBE_SHORTS_TITLES.txt
          if-no-files-found: warn
          retention-days: 7
