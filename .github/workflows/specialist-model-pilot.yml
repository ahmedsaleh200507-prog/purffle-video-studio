name: Separate text and vision specialist auditions
on:
  push:
    branches: [chatgpt/yellow-system-fixes]
    paths: ['.github/workflows/specialist-model-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specialist-model-pilot
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        role: [text, vision]
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PURFFLE_OPENROUTER_FREE_CONFIRMED: ${{ vars.PURFFLE_OPENROUTER_FREE_CONFIRMED }}
      PURFFLE_CLOUDFLARE_FREE_CONFIRMED: ${{ vars.PURFFLE_CLOUDFLARE_FREE_CONFIRMED }}
      PURFFLE_LOCAL_LLM: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'Pillow>=10.1,<14' 'langdetect==1.0.9' 'jsonschema>=4.20,<5' 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_specialist_model_pilot.py
      - run: python scripts/specialist_model_pilot.py --role ${{ matrix.role }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specialist-pilot-${{ matrix.role }}
          path: specialist-pilot/
          if-no-files-found: warn
          retention-days: 7
