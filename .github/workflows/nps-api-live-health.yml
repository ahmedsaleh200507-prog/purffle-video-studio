name: NPS Video API live health (search only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nps-api-live-health.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-nps-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PYTHONPATH: scripts
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVER2: ${{ secrets.COVER2 }}
      VECTEEZY_API_KEY: ${{ secrets.VECTEEZY_API_KEY }}
      PURFFLE_NO_ATTRIBUTION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Check API connectivity and policy without downloads
        run: |
          python - <<'PY'
          import os
          from dataclasses import dataclass, field
          from video_sources import ProviderRegistry

          @dataclass
          class MediaItem:
              source: str
              id: str
              kind: str
              url: str = ''
              width: int = 0
              height: int = 0
              duration: float = 0
              credit: str = ''
              query: str = ''
              rank: int = 0
              text: str = ''
              extra: dict = field(default_factory=dict)

          reg = ProviderRegistry(MediaItem)
          clips = reg.search('nps-video', 'ocean waves')
          state = reg.events[-1]['status']
          print(f'NPS_AUTH_AND_SEARCH={state}; license_candidate_count={len(clips)}')
          print('NPS result counts mean metadata only, not rendered HD footage')
          print('COVERR_PRIMARY_PRESENT=' + str(bool(os.getenv('COVERR_API_KEY'))))
          print('COVER2_ALIAS_PRESENT=' + str(bool(os.getenv('COVER2'))))
          print('VECTEEZY_API_KEY_PRESENT=' + str(bool(os.getenv('VECTEEZY_API_KEY'))))
          print('VECTEEZY_POLICY=' + reg.providers['vecteezy-video'].unavailable_reason())
          if state not in ('ok', 'empty'):
              raise SystemExit('NPS_API_NOT_READY: ' + state)
          PY
