name: Pixel-first metadata deferral proof
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: scripts
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - run: pip install torch==2.6.0+cpu torchvision==0.21.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'transformers==4.57.1' 'accelerate>=1,<2' 'Pillow>=10.1,<14' requests 'sentencepiece>=0.2,<1' 'pytest>=8,<10' decord num2words 'av>=14,<17'
      - run: python -m compileall -q scripts
      - run: python -m pytest -q tests/test_pixel_first_policy.py
      - name: Test real source pixels independent of sparse metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,time,torch
          from media_validation import SceneMatcher,SceneSpec,ValidationError
          from video_contrast_audit import fixture
          from pixel_first_policy import metadata_rank,verify_pixels
          torch.set_num_threads(2)
          path=Path("people.avi")
          fixture(path)
          matcher=SceneMatcher()
          spec=SceneSpec.from_dict(dict(main_character="",object="people",action="walking",location="outdoors",time="day",visual_search_query="people walking outdoors"))
          score,state=metadata_rank(matcher,spec,"Outdoor documentary footage")
          assert state=="deferred"
          out={}
          for name,pos,neg in (
              ("walking","People walking outdoors.","People riding bicycles outdoors."),
              ("bicycle","People riding bicycles outdoors.","People walking outdoors."),
              ("whale","A whale swimming in the sea.","People walking outdoors.")):
              try:
                  result=verify_pixels(path,4.,.5,{"positive":pos,"negative":neg},matcher,deadline=time.monotonic()+150)
              except Exception as exc:
                  result={"verified":False,"error":str(exc)[:300]}
              out[name]=result
              print("PIXEL FIRST",name,json.dumps(result),flush=True)
          Path("pixel-first-report.json").write_text(json.dumps(out,indent=2))
          assert out["walking"]["verified"] and not any(out[n]["verified"] for n in ("bicycle","whale"))
          assert not any("error" in r for r in out.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-first-report
          path: pixel-first-report.json
          if-no-files-found: warn
