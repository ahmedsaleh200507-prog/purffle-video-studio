name: Yellow system regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/visual_language_review.py'
      - 'scripts/dynamic_crop.py'
      - 'scripts/short_caption_style.py'
      - 'scripts/production_checkpoint.py'
      - 'tests/test_visual_language_review.py'
      - 'tests/test_dynamic_crop.py'
      - 'tests/test_short_caption_style.py'
      - 'tests/test_production_checkpoint.py'
      - 'scripts/action_window.py'
      - 'scripts/visual_score_cache.py'
      - 'scripts/siglip_review.py'
      - 'scripts/output_qa.py'
      - 'scripts/object_region_review.py'
      - 'tests/test_action_window.py'
      - 'tests/test_visual_score_cache.py'
      - 'tests/test_siglip_review.py'
      - 'tests/test_v4_output_qa.py'
      - 'tests/test_object_region_review.py'
      - '.github/workflows/yellow-regressions.yml'
  workflow_dispatch:
concurrency:
  group: yellow-regressions-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<14' 'pytest>=8,<10'
      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: |
          python -m unittest discover -s tests -p test_visual_language_review.py
          python -m unittest discover -s tests -p test_dynamic_crop.py
          python -m unittest discover -s tests -p test_short_caption_style.py
          python -m unittest discover -s tests -p test_production_checkpoint.py
          python -m unittest discover -s tests -p test_action_window.py
          python -m unittest discover -s tests -p test_visual_score_cache.py
          python -m unittest discover -s tests -p test_siglip_review.py
          python -m unittest discover -s tests -p test_object_region_review.py
          python -m pytest -q tests/test_v4_output_qa.py
