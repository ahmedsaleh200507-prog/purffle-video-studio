name: '05 - Test All Text Models'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cloud_model_router.py'
      - 'scripts/cloud_model_audit.py'
      - 'tests/test_cloud_model_router.py'
      - '.github/workflows/cloud-model-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3' 'jsonschema>=4.20,<5'
      - name: Verify fallback routing
        run: python -m unittest discover -s tests -p test_cloud_model_router.py
      - name: Live test existing account access
        run: python scripts/cloud_model_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-model-audit
          path: cloud-model-audit/
          if-no-files-found: warn
